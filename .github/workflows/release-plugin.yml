name: release plugin

on:
  push:
    tags: ["autocorrection-v*", "adaptive-prediction-v*", "autosuggestions-v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: ./scripts/release-plugin.sh "$GITHUB_REF_NAME"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          make_latest: false
